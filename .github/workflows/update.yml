name: 騰落レシオを更新

on:
  schedule:
    # 日本時間 16:30 と 18:30(平日)。東証の大引け後にデータが出ます。
    - cron: "30 7 * * 1-5"
    - cron: "30 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 必要なライブラリを入れる
        run: pip install requests pypdf
      - name: 騰落レシオを計算する
        run: python scripts/update.py
      - name: 変更があれば保存する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "騰落レシオを更新"
            git push
          fi
